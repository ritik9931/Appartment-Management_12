<meta name="viewport" content="width=device-width, initial-scale=1.0">

<header class="navbar pcoded-header navbar-expand-lg navbar-light header-dark">
  <div class="m-header">
    <a class="mobile-menu" (click)="toggleSidebar()"><span></span></a>
    <a class="b-brand">
      <span class="logo-text">RadhaKrishna</span>
    </a>
    <a href="javascript:void(0);" class="mob-toggler"><i class="feather icon-more-vertical"></i></a>
  </div>

  <div class="collapse navbar-collapse">
    <ul class="navbar-nav ml-auto">
      <li class="nav-item dropdown" (click)="toggleNotifications(); $event.preventDefault()" style="position: relative;">
        <a class="dropdown-toggle" href="javascript:void(0);">
          <i class="feather icon-bell"></i>
          <span class="badge badge-pill badge-danger">5</span>
        </a>
        <div *ngIf="isNotificationsOpen" class="dropdown-menu dropdown-menu-right notification show">
          <div class="noti-head">
            <h6>Notifications</h6>
            <div class="float-right">
              <a href="javascript:void(0);" class="mr-2">Mark as Read</a>
              <a href="javascript:void(0);">Clear All</a>
            </div>
          </div>
          <ul class="noti-body">
            <li class="notification">
              <div class="media">
                <img src="assets/images/user/avatar-1.jpg" alt="User" class="img-radius">
                <div class="media-body">
                  <p><strong>John Doe</strong> - New ticket added</p>
                  <span class="n-time text-muted">5 min ago</span>
                </div>
              </div>
            </li>
          </ul>
          <div class="noti-footer">
            <a href="javascript:void(0);">Show All</a>
          </div>
        </div>
      </li>

      <li class="nav-item dropdown" (click)="toggleProfile(); $event.preventDefault()" style="position: relative;">
        <a href="javascript:void(0);" class="dropdown-toggle">
          <i class="feather icon-user"></i>
        </a>
        <div *ngIf="isProfileOpen" class="dropdown-menu dropdown-menu-right profile-notification show">
          <div class="pro-head">
            <img src="assets/images/user/avatar-1.jpg" alt="User" class="img-radius">
            <span>{{ name }}</span>
            <a (click)="logout()" class="dud-logout" title="Logout">
              <i class="feather icon-log-out"></i>
            </a>
          </div>
          <ul class="pro-body">
            <li>
              <a routerLink="/menu" class="dropdown-item">
                <i class="feather icon-user"></i> Menu
              </a>
            </li>
            <li>
              <a (click)="logout()" class="dropdown-item">
                <i class="feather icon-lock"></i> Logout
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </div>
</header>

<nav class="pcoded-navbar" [class.open]="isSidebarOpen" [class.collapsed]="isSidebarCollapsed">
  <div class="navbar-wrapper">
    <div class="navbar-content scroll-div">
      <ul class="nav pcoded-inner-navbar">
        <li class="nav-item pcoded-menu-caption">
          <label>Navigation</label>
        </li>
        <li class="nav-item">
          <a routerLink="/menu/complaint-dashboard" routerLinkActive="active" class="nav-link" [routerLinkActiveOptions]="{ exact: true }">
            <span class="pcoded-micon"><i class="feather icon-home"></i></span>
            <span class="pcoded-mtext">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/menu/complaint" routerLinkActive="active" class="nav-link">
            <span class="pcoded-micon"><i class="feather icon-user"></i></span>
            <span class="pcoded-mtext">Complaint</span>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/menu/complaint-status" routerLinkActive="active" class="nav-link">
            <span class="pcoded-micon"><i class="feather icon-user"></i></span>
            <span class="pcoded-mtext">Complaint Status</span>
          </a>
        </li>
        <!-- Add more income-related links here if needed -->
      </ul>
    </div>
  </div>
</nav>

<div class="pcoded-main-container">
  <div class="pcoded-content">
    <router-outlet></router-outlet>
  </div>
</div>
