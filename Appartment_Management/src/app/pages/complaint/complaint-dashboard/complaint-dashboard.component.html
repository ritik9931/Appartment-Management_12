<div class="card shadow-sm mb-4">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <h5 class="mb-0">
      <i class="bi bi-exclamation-diamond me-2"></i> Recent Complaints
    </h5>
    <!-- <a class="btn btn-sm btn-light" [routerLink]="'/complaints'">
      View All <i class="bi bi-arrow-right"></i>
    </a> -->
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0 text-center align-middle">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Type</th>
            <th>Status</th>
            <th>Date</th>
            <th>Close On</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let complaint of latestComplaints; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ complaint.comp_type }}</td>
            <td>
              <span [ngClass]="statusClass(complaint.comp_status)">
                {{ complaint.comp_status }}
              </span>
            </td>
            <td>{{ complaint.created_at | date: 'shortDate' }}</td>
            <td>
              <ng-container *ngIf="complaint.comp_status === 'Closed'; else noClose">
                {{ complaint.close_on | date: 'yyyy-MM-dd' }}
              </ng-container>
              <ng-template #noClose>—</ng-template>
            </td>
          </tr>
          <tr *ngIf="!latestComplaints.length">
            <td colspan="4" class="text-muted">No complaints found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
