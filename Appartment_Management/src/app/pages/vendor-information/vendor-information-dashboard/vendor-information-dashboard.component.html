<div class="container py-4">
  <h2 class="text-primary mb-4 fw-bold animate__animated animate__fadeInDown">
    <i class="bi bi-bar-chart-line me-2"></i>Vendor Information Dashboard
  </h2>

  <!-- Summary Cards -->
  <div class="row g-4 mb-4">
    <div class="col-md-4" *ngFor="let card of [
      { label: 'Total Vendors', value: dashboardStats.total, icon: 'people-fill', color: 'primary' },
      { label: 'Active Vendors', value: dashboardStats.active, icon: 'check-circle-fill', color: 'success' },
      { label: 'Inactive Vendors', value: dashboardStats.inactive, icon: 'x-circle-fill', color: 'danger' }
    ]">
      <div class="card border-0 shadow-sm h-100 animate__animated animate__zoomIn">
        <div class="card-body d-flex align-items-center">
          <div class="me-3">
            <i class="bi bi-{{ card.icon }} text-{{ card.color }} display-6"></i>
          </div>
          <div>
            <h6 class="card-title text-muted">{{ card.label }}</h6>
            <h4 class="fw-bold text-{{ card.color }}">{{ card.value }}</h4>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Vendors by Type -->
  <div class="card shadow-sm border-0 mb-4 animate__animated animate__fadeInUp">
    <div class="card-header bg-light fw-semibold">
      <i class="bi bi-diagram-3-fill me-2 text-info"></i>Vendors by Type
    </div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let type of dashboardStats.types | keyvalue">
        {{ type.key }}
        <span class="badge bg-info rounded-pill">{{ type.value }}</span>
      </li>
    </ul>
  </div>

  <!-- Recent Vendors Table -->
  <div class="card shadow-sm border-0 animate__animated animate__fadeInUp">
    <div class="card-header bg-light fw-semibold">
      <i class="bi bi-clock-history me-2 text-warning"></i>Recent Vendors
    </div>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Contact</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let vendor of vendorList">
            <td>{{ vendor.name }}</td>
            <td>{{ vendor.vendorType }}</td>
            <td>{{ vendor.contactNumber }}</td>
            <td [ngClass]="{
      'status-yes': vendor.isActive === 'yes',
      'status-no': vendor.isActive === 'no'
    }">
              {{ vendor.isActive | titlecase }}
            </td>
          <tr *ngIf="vendorList.length === 0">
            <td colspan="4" class="text-center text-muted py-3">No vendors found.</td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>
</div>
